{% extends 'base.html' %}{% block title %}Форма поезда{% endblock %}{% block content %}<h1>{{'Редактировать' if train else 'Создать'}} поезд</h1><form method="post" class="edit"><label>Номер<input name="number" value="{{train.number if train else ''}}" required></label><label>Станция отправления<select name="origin_id" required>{% for s in stations %}<option value="{{s.id}}" {% if train and train.origin_id==s.id %}selected{% endif %}>{{s.name}}</option>{% endfor %}</select></label><label>Станция прибытия<select name="destination_id" required>{% for s in stations %}<option value="{{s.id}}" {% if train and train.destination_id==s.id %}selected{% endif %}>{{s.name}}</option>{% endfor %}</select></label><label>Дата и время<input type="datetime-local" name="departure" value="{{train.departure.strftime('%Y-%m-%dT%H:%M') if train else '2026-12-10T10:00'}}" required></label><label>Цена, ₽<input type="number" name="fare" value="{{train.fare if train else 2500}}" min="1" required></label><label>Свободных мест<input type="number" name="seats" value="{{train.seats if train else 50}}" min="0" required></label><label>Статус<select name="status"><option value="scheduled">По расписанию</option><option value="delayed" {% if train and train.status=='delayed' %}selected{% endif %}>Задержан</option></select></label><button>Сохранить</button></form>{% endblock %}
